<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Challenge · Postgames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
  <link rel="stylesheet" href="../assets/global/global.css?v=143">
  <link rel="stylesheet" href="../assets/top10/css/top10.css?v=143">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0b0d12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Postgames">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>

<body>

  <header class="site-header">
    <a href="../index.html" class="brand">POSTGAMES</a>
    <nav class="site-nav">
      <a href="top10.html" class="active">Trivia</a>
      <a href="debates.html">Debates</a>
      <a href="movies.html">Movies</a>
      <a href="snacks.html">Snacks</a>
    </nav>
  </header>

  <main class="page daily">

    <div class="intro">
      <p id="dailyEyebrow" class="eyebrow">Daily</p>
      <h1 class="display intro-title">Who's Missing?</h1>
      <p class="lede">One name is missing from today's top 10. You get five guesses, and every miss unlocks a hint.</p>
    </div>

    <!-- Test mode: tap "Daily #N" five times. Plays any day; saved apart from the real record. -->
    <div id="testBar" class="daily-test hidden">
      <span class="daily-test-label">Test mode</span>
      <button id="testPrev" class="btn daily-test-btn" type="button" aria-label="Previous day">‹</button>
      <span id="testDay" class="daily-test-day"></span>
      <button id="testNext" class="btn daily-test-btn" type="button" aria-label="Next day">›</button>
      <button id="testReset" class="link-btn" type="button">Replay</button>
      <button id="testExit" class="link-btn" type="button">Exit</button>
    </div>

    <p id="dailyStatus" class="hint daily-status" role="status"></p>

    <section id="dailyGame" class="daily-game hidden">
      <header class="play-head">
        <p id="dailyContext" class="eyebrow"></p>
        <h2 id="dailyStat" class="display play-stat"></h2>
        <p id="dailyQualifier" class="hint stat-qualifier"></p>
      </header>

      <!-- One box per guess: ❌ miss, 💡 hint taken, ✅ got it -->
      <div id="dailyMarks" class="daily-marks" aria-label="Guesses used"></div>

      <ol id="dailyHints" class="daily-hints"></ol>

      <div id="dailyPlay" class="daily-play">
        <form id="guessForm" class="guess-form" autocomplete="off">
          <input id="guessInput" class="input guess-input" type="text" placeholder="Who's missing?"
            autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="go"
            role="combobox" aria-autocomplete="list" aria-controls="guessResults" aria-expanded="false"
            aria-label="Your guess">
          <ul id="guessResults" class="guess-results hidden" role="listbox"></ul>
        </form>
        <button id="hintBtn" class="link-btn daily-hint-btn" type="button">Take a hint (uses a guess)</button>
        <p id="dailyFeedback" class="feedback" role="status" aria-live="polite"></p>
      </div>

      <div id="dailyDone" class="daily-done hidden">
        <p id="doneTitle" class="display daily-done-title"></p>
        <p id="doneSub" class="lede"></p>
        <button id="shareBtn" class="btn btn-primary btn-block" type="button">Share result</button>
        <p id="shareStatus" class="hint center" role="status"></p>
        <div id="dailySummary"></div>
        <p id="nextPuzzle" class="hint center"></p>
        <a class="link-btn intro-link" href="top10-topshelf.html">Also today: Top Shelf</a>
      </div>

      <ol id="dailyBoard" class="board"></ol>
    </section>

    <a class="link-btn intro-link" href="top10.html">Back to trivia</a>

    <p class="version">Version 143</p>
  </main>

  <script defer src="../assets/top10/js/top10-common.js?v=143"></script>
  <script defer src="../assets/top10/js/top10-teams.js?v=143"></script>
  <script defer src="../assets/top10/js/top10-records.js?v=143"></script>
  <script defer src="../assets/top10/js/top10-daily.js?v=143"></script>

</body>
</html>
